<mat-form-field
  [appearance]="appearance"
  [subscriptSizing]="subscriptSizing"
  class="w-full"
  [style.--mdc-outlined-text-field-outline-color]="color.primary"
  [style.--mdc-outlined-text-field-hover-outline-color]="color.primary"
  [style.--mdc-outlined-text-field-focus-outline-color]="color.primary"
  [style.--mdc-outlined-text-field-focus-label-text-color]="color.primary"
  [style.--mdc-outlined-text-field-label-text-color]="color.primary"
  [style.--mdc-outlined-text-field-hover-label-text-color]="color.primary"
  [style.--mdc-outlined-text-field-input-text-color]="color.ink"
  [style.--mdc-outlined-text-field-input-text-placeholder-color]="color.inkMuted"
  [style.--mdc-outlined-text-field-caret-color]="color.primary"
  [style.--mat-form-field-leading-icon-color]="color.primary"
>
  @if (label) {
    <mat-label>{{ label }}</mat-label>
  }

  @if (prefixIcon) {
    <mat-icon matPrefix>{{ prefixIcon }}</mat-icon>
  }

  @if (multiline) {
    <textarea
      matInput
      [rows]="rows"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
    ></textarea>
  } @else {
    <input
      matInput
      [type]="inputType"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [autocomplete]="autocomplete"
      [value]="value"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
    />
  }

  @if (type === 'password') {
    <app-button
      matSuffix
      iconOnly
      size="sm"
      type="button"
      tooltip="Visualizar senha"
      [tabIndex]="-1"
      [color]="color.inkMuted"
      [icon]="hidePassword ? 'visibility_off' : 'visibility'"
      (click)="hidePassword = !hidePassword"
      class="mr-4"
    />
  }

  @if (hint && !showError) {
    <mat-hint>{{ hint }}</mat-hint>
  }

  @if (showError) {
    <mat-error>{{ errorMessage }}</mat-error>
  }
</mat-form-field>
