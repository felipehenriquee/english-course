<ng-template #modalTpl>
  <div
    cdkTrapFocus
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    class="flex max-h-[85vh] w-[92vw] flex-col overflow-hidden rounded-lg bg-white shadow-xl"
    [class.max-w-sm]="size === 'sm'"
    [class.max-w-md]="size === 'md'"
    [class.max-w-2xl]="size === 'lg'"
    [class.max-w-4xl]="size === 'xl'"
  >
    <header class="flex items-center justify-between gap-4 border-b border-slate-200 px-4 py-3">
      <h2 class="text-lg font-semibold">{{ title }}</h2>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'common.close' | transloco"
        (click)="closed.emit()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <div class="flex-1 overflow-y-auto px-4 py-4">
      <ng-content />
    </div>

    @if (showFooter) {
      <footer class="flex justify-end gap-2 border-t border-slate-200 px-4 py-3">
        <button mat-button type="button" (click)="cancelled.emit()">
          {{ cancelLabel ?? ('common.cancel' | transloco) }}
        </button>
        <button
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="saving"
          (click)="save.emit()"
        >
          {{ saveLabel ?? ('common.save' | transloco) }}
        </button>
      </footer>
    }
  </div>
</ng-template>
