@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <button
      type="button"
      aria-label="Fechar"
      class="absolute inset-0 h-full w-full cursor-default border-0 bg-black/40 p-0"
      (click)="closed.emit()"
    ></button>

    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title"
      class="relative z-10 flex max-h-[90vh] w-full flex-col rounded-lg bg-white shadow-xl"
      [class.max-w-sm]="size === 'sm'"
      [class.max-w-md]="size === 'md'"
      [class.max-w-2xl]="size === 'lg'"
      [class.max-w-4xl]="size === 'xl'"
    >
      <header class="flex items-center justify-between gap-4 border-b border-slate-200 px-4 py-3">
        <h2 class="text-lg font-semibold">{{ title }}</h2>
        <button mat-icon-button type="button" aria-label="Fechar" (click)="closed.emit()">
          <mat-icon>close</mat-icon>
        </button>
      </header>

      <div class="flex-1 overflow-y-auto px-4 py-4">
        <ng-content />
      </div>

      @if (showFooter) {
        <footer class="flex justify-end gap-2 border-t border-slate-200 px-4 py-3">
          <button mat-button type="button" (click)="cancelled.emit()">{{ cancelLabel }}</button>
          <button
            mat-flat-button
            color="primary"
            type="button"
            [disabled]="saving"
            (click)="save.emit()"
          >
            {{ saveLabel }}
          </button>
        </footer>
      }
    </div>
  </div>
}
