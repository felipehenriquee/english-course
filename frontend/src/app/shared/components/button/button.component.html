<button
  [attr.type]="type"
  [attr.tabindex]="tabIndex"
  [disabled]="disabled"
  [class]="computedClass"
  [style]="computedStyle"
  [attr.aria-label]="ariaLabel"
  [matTooltip]="tooltip ?? ''"
  [matTooltipDisabled]="!tooltip"
>
  @if (iconOnly) {
    <mat-icon [class]="glyphClass">{{ icon }}</mat-icon>
  } @else {
    @if (icon && iconPosition === 'left') {
      <mat-icon [class]="glyphClass">{{ icon }}</mat-icon>
    }
    <ng-content />
    @if (icon && iconPosition === 'right') {
      <mat-icon [class]="glyphClass">{{ icon }}</mat-icon>
    }
  }
</button>
