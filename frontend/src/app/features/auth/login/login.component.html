<div class="bg-scene flex min-h-screen items-center justify-center px-4">
  <app-card class="tilt-a w-full max-w-md rounded-3xl p-8">
    <div class="-rotate-[-1.4deg]">
      <div class="text-left">
        <p class="text-[11px] uppercase text-sp-neutral-600">{{ 'login.eyebrow' | transloco }}</p>
        <h1 class="font-display-700 text-[30px] !tracking-tight text-sp-neutral-50">
          {{ 'login.heading' | transloco }}
        </h1>
      </div>

      <div class="pt-6">
        @if (authStore.error()) {
          <div class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">
            {{ authStore.error() }}
          </div>
        }

        <form
          [formGroup]="form"
          class="flex flex-col gap-3"
          style="
            --mat-form-field-container-text-font: 'Manrope', sans-serif;
            --mdc-filled-text-field-label-text-font: 'Manrope', sans-serif;
          "
          (ngSubmit)="onSubmit()"
        >
          <app-input
            [label]="'login.email' | transloco"
            type="email"
            appearance="fill"
            subscriptSizing="dynamic"
            formControlName="email"
            autocomplete="email"
            [errorMessage]="'login.emailInvalid' | transloco"
          />

          <app-input
            [label]="'login.password' | transloco"
            type="password"
            appearance="fill"
            subscriptSizing="dynamic"
            formControlName="password"
            autocomplete="current-password"
            [errorMessage]="'login.required' | transloco"
          />

          <app-button
            type="submit"
            variant="filled"
            [color]="color.primary"
            [textColor]="color.neutral900"
            size="lg"
            class="mt-1"
            extraClass="!h-14"
            [fullWidth]="true"
            [pill]="true"
            [disabled]="authStore.loading()"
          >
            @if (authStore.loading()) {
              <mat-spinner diameter="20" class="mx-auto" />
            } @else {
              {{ 'login.submit' | transloco }}
            }
          </app-button>
        </form>

        <p class="!mt-2 text-center text-sm text-sp-neutral-600 underline">
          {{ 'login.noAccount' | transloco }}
          <span class="cursor-not-allowed font-medium">{{
            'login.createAccount' | transloco
          }}</span>
        </p>
      </div>
    </div>
  </app-card>
</div>
