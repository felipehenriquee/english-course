<app-resource-list
  [title]="'users.title' | transloco"
  [columns]="columns"
  [rows]="usersStore.items()"
  [loading]="usersStore.loading()"
  [error]="usersStore.error()"
  [addLabel]="'users.add' | transloco"
  [showAdd]="true"
  [searchPlaceholder]="'users.search' | transloco"
  [emptyMessage]="'users.empty' | transloco"
  (add)="openCreate()"
  (searchChange)="applySearch($event)"
  (edit)="openEdit($event)"
  (remove)="remove($event)"
/>
