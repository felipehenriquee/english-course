<h2 mat-dialog-title>
  {{ (data.user ? 'users.form.editTitle' : 'users.form.newTitle') | transloco }}
</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="flex flex-col gap-1">
    <app-input [label]="'users.form.name' | transloco" formControlName="name" />

    <app-input [label]="'users.form.email' | transloco" type="email" formControlName="email" />

    <mat-form-field appearance="outline">
      <mat-label>{{ 'users.form.role' | transloco }}</mat-label>
      <mat-select formControlName="role">
        @for (role of roles; track role) {
          <mat-option [value]="role">{{ 'users.roles.' + role | transloco }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-slide-toggle formControlName="active">{{
      'users.form.active' | transloco
    }}</mat-slide-toggle>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <app-button variant="text" [color]="color.neutral50" type="button" (click)="cancel()">
      {{ 'common.cancel' | transloco }}
    </app-button>
    <app-button [color]="color.primary" [textColor]="color.neutral900" type="submit">
      {{ 'common.save' | transloco }}
    </app-button>
  </mat-dialog-actions>
</form>
