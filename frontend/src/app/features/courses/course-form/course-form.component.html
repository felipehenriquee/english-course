<div class="p-4 md:p-6">
  <div class="mb-4 flex items-center gap-2">
    <a mat-icon-button routerLink="/courses" [title]="'common.back' | transloco">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h1 class="text-xl font-semibold">
      {{ (isEdit ? 'courses.form.editTitle' : 'courses.form.newTitle') | transloco }}
    </h1>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="max-w-xl rounded-lg border border-slate-200 bg-white p-4 md:p-6"
  >
    <div class="flex flex-col gap-1">
      <app-input
        [label]="'courses.form.name' | transloco"
        formControlName="name"
        [errorMessage]="'courses.form.nameRequired' | transloco"
      />

      <app-input
        [label]="'courses.form.description' | transloco"
        formControlName="description"
        multiline
        [rows]="4"
      />
    </div>

    <div class="mt-2 flex justify-end gap-2">
      <a mat-button routerLink="/courses" type="button">{{ 'common.cancel' | transloco }}</a>
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ (isEdit ? 'courses.form.submitEdit' : 'courses.form.submitNew') | transloco }}
      </button>
    </div>
  </form>
</div>
