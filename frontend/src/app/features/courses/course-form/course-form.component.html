<div class="p-4 md:p-6">
  <app-detail-header
    [title]="(isEdit ? 'courses.form.editTitle' : 'courses.form.newTitle') | transloco"
    backLink="/courses"
  />

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="glass max-w-xl overflow-hidden rounded-lg p-4 md:p-6"
  >
    <div class="flex flex-col gap-1">
      <app-input
        [label]="'courses.form.name' | transloco"
        formControlName="name"
        [errorMessage]="'courses.form.nameRequired' | transloco"
      />

      <app-input
        [label]="'courses.form.description' | transloco"
        formControlName="description"
        multiline
        [rows]="4"
      />
    </div>

    <div class="mt-2 flex justify-end gap-2">
      <app-button variant="text" [color]="color.neutral50" type="button" (click)="cancel()">
        {{ 'common.cancel' | transloco }}
      </app-button>
      <app-button
        [color]="color.primary"
        [textColor]="color.neutral900"
        type="submit"
        [disabled]="saving()"
      >
        {{ (isEdit ? 'courses.form.submitEdit' : 'courses.form.submitNew') | transloco }}
      </app-button>
    </div>
  </form>
</div>
