<div class="p-4 md:p-6">
  <div class="mb-4 flex items-center gap-2">
    <a mat-icon-button routerLink="/courses" title="Voltar">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h1 class="text-xl font-semibold">{{ isEdit ? 'Editar curso' : 'Novo curso' }}</h1>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="max-w-xl rounded-lg border border-slate-200 bg-white p-4 md:p-6"
  >
    <div class="flex flex-col gap-1">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" />
        @if (form.controls.name.hasError('required') && form.controls.name.touched) {
          <mat-error>Informe o nome do curso.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="description" rows="4"></textarea>
      </mat-form-field>
    </div>

    <div class="mt-2 flex justify-end gap-2">
      <a mat-button routerLink="/courses" type="button">Cancelar</a>
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ isEdit ? 'Salvar' : 'Cadastrar' }}
      </button>
    </div>
  </form>
</div>
