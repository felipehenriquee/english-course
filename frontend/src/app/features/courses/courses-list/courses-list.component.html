<app-resource-list
  [columns]="columns"
  [rows]="coursesStore.items()"
  [loading]="coursesStore.loading()"
  [error]="coursesStore.error()"
  [addLabel]="'courses.add' | transloco"
  addRoute="/courses/new"
  [searchPlaceholder]="'courses.search' | transloco"
  [emptyMessage]="'courses.empty' | transloco"
  (searchChange)="applySearch($event)"
  (rowClick)="openCourse($event)"
  (edit)="editCourse($event)"
  (remove)="removeCourse($event)"
/>
