<div class="p-4 md:p-6">
  <h1 class="text-xl font-semibold">
    {{
      (authStore.user()?.name ? 'home.helloName' : 'home.hello')
        | transloco: { name: authStore.user()?.name }
    }}
  </h1>
  <p class="mt-1 text-slate-600">{{ 'home.subtitle' | transloco }}</p>

  <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <mat-card class="!p-4">
      <p class="text-sm text-slate-500">{{ 'home.cardExample' | transloco }}</p>
      <p class="text-2xl font-semibold">42</p>
    </mat-card>
  </div>
</div>
