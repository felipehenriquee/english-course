services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend:latest
    container_name: backend-api
    env_file: .env
    environment:
      # No compose o host do banco é o nome do serviço, não localhost
      DB_HOST: db
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Serviço de banco para DB_TYPE=mysql.
  # Trocando para Postgres ou SQLite, ajuste/remova este serviço (ver SKILL.md, Passo 0).
  db:
    image: mysql:8.4
    container_name: backend-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-english_course}
      MYSQL_USER: ${DB_USERNAME:-english_course}
      MYSQL_PASSWORD: ${DB_PASSWORD:-english_course}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-english_course}
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD:-english_course}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
