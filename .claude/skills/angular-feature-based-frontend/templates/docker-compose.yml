services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: __PROJECT_NAME__:latest
    container_name: __PROJECT_NAME__
    ports:
      - '8080:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
